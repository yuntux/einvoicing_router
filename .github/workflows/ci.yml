name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -q

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run build (vue-tsc + vite build)
        run: npm run build

  frontend-tests:
    name: Frontend (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # `Settings.oidc_mode`/`jwt_secret`/`session_secret`/`secrets_encryption_key`
    # (backend/app/config.py) n'ont volontairement aucune valeur par défaut
    # (fail-closed, § audit sécurité) — contrairement au job `backend-tests`, protégé
    # par le fallback de `backend/tests/conftest.py`, ce job démarre un vrai backend
    # (pour Playwright) et doit donc les fournir lui-même explicitement.
    env:
      ROUTER_OIDC_MODE: disabled
      ROUTER_JWT_SECRET: ci-test-jwt-secret
      ROUTER_SESSION_SECRET: ci-test-session-secret
      ROUTER_SECRETS_ENCRYPTION_KEY: ci-test-secrets-encryption-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies (test server for e2e)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Start backend
        working-directory: backend
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage-reports/
          retention-days: 7
