[project]
name = "einvoicing-router"
version = "0.1.0"
description = "Routeur de factures électroniques AFNOR XP Z12-013"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10",
    "pyfrctc>=0.22",
    "cryptography>=43",
    # Utilisé directement par app/auth/oidc.py (flux OIDC Entra ID) et
    # app/services/webhook_sender.py (notification webhook vers Odoo) — jusqu'ici
    # disponible uniquement en dépendance transitive de pyfrctc, déclaré ici pour ne
    # pas dépendre silencieusement de son arbre de dépendances.
    "requests>=2.32",
    # Serveur OAuth2 (client_credentials, § 4.4/§ 4.10) et client OIDC (Entra ID,
    # NF3) : conformité RFC 6749/OIDC déléguée à Authlib plutôt que réimplémentée.
    "authlib>=1.3",
    # Requis par starlette.middleware.sessions.SessionMiddleware, utilisée par
    # Authlib (authlib.integrations.starlette_client) pour stocker state/nonce OIDC
    # côté serveur pendant le flux Entra ID.
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
